services:
  backend:
    container_name: seo-backend
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/seo_geo_analyzer
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost
    env_file:
      - ./Backend/.env
    restart: always

  frontend:
    container_name: seo-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BASE_URL=http://localhost:5000/api/v1
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
